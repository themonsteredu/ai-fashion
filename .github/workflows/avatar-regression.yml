name: Camera-free avatar regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm test
      - run: npm run test:avatar
      - run: node tests/puppet-stretch-browser.mjs
      - run: node tests/pelvis-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: avatar-regression
          path: test-results/
