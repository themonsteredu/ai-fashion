<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모둠 동작 영상 · MOAKIT</title><link rel="icon" href="data:,"><link rel="stylesheet" href="css/group-motion.css?v=studio4"><script type="importmap">{"imports":{"three":"./lib/three.module.min.js","three/addons/":"./lib/three/addons/"}}</script></head><body>
<main><header><div><p class="eyebrow">MOAKIT · 몸으로 표현하기</p><h1>우리 모둠의 동작 영상</h1></div><nav><a class="button" href="./index.html">처음으로</a><a class="button" href="./teacher-settings.html">교사용 설정</a></nav></header>
<section id="entry" class="entry"><p class="eyebrow">수업에 참여하기</p><h2>수업코드를 입력하고 우리 모둠을 선택해요</h2>
<form id="join-form"><label for="room-code">수업코드<input id="room-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="off" required placeholder="6자리 코드"></label>
<fieldset><legend>우리 모둠</legend><div class="group-picker"><label><input type="radio" name="group" value="1" required><span>1모둠</span></label><label><input type="radio" name="group" value="2" required><span>2모둠</span></label><label><input type="radio" name="group" value="3" required><span>3모둠</span></label><label><input type="radio" name="group" value="4" required><span>4모둠</span></label><label><input type="radio" name="group" value="5" required><span>5모둠</span></label><label><input type="radio" name="group" value="6" required><span>6모둠</span></label></div></fieldset><button class="primary" id="join-submit">수업방 입장</button><p id="join-status" role="status"></p></form></section>
<section id="studio" hidden><div class="room-bar" hidden><div><h2 id="room-label"></h2><span id="room-code-label"></span></div><button id="leave">모둠 나가기</button></div>
<div class="workspace"><section class="view"><h2>내 아바타</h2><span id="timer" aria-live="off" hidden>0:00</span><div id="avatar-stage"><p class="stage-hint">아바타를 준비하고 있어요.</p></div></section><section class="view"><h2>내 모습</h2><div class="camera-stage"><video id="camera" playsinline muted></video><p id="camera-hint">카메라 연결 중…</p><span id="countdown" hidden></span></div></section></div>
<div class="actions" hidden><button id="camera-start" disabled>카메라 켜기</button><button id="calibrate" disabled>자세 다시 맞추기</button><label>아바타<select id="avatar" disabled><option value="boy">남학생</option><option value="girl">여학생</option></select></label><label>보기<select id="view" disabled><option value="0">정면</option><option value="1.5708">측면</option><option value="3.14159">뒷면</option></select></label><label id="zoom-label" hidden>카메라 줌<input id="zoom" type="range" aria-label="카메라 줌"></label><button id="demo" disabled>시범 동작 보기</button></div>
<p hidden id="tracking" role="status" aria-live="polite"></p>
<div class="record-options"><label>저장할 화면<select id="capture-mode"><option value="avatar">아바타만</option><option value="both" selected>아바타 + 내 모습</option></select></label></div>
<section class="record-panel" aria-label="녹화 조작"><button id="record" class="primary" disabled>녹화</button><button id="pause" disabled>일시정지</button><button id="review">재생하기</button><button id="save" disabled>저장하기</button><button id="stop" hidden disabled>녹화 끝내기</button></section>
<p hidden id="record-help">카메라를 켜면 녹화할 수 있어요.</p><p id="notice" role="status" aria-live="polite"></p>
</section>
<dialog id="recordings" aria-labelledby="recordings-title"><header><h2 id="recordings-title">우리 모둠 녹화</h2><button id="recordings-close">닫기</button></header><div class="actions"><button id="refresh-clips">새로고침</button></div><p id="clips-status" role="status"></p><div id="pending" hidden><h3>방금 찍은 영상</h3><video id="pending-video" controls playsinline></video><div class="actions"><button id="retry-upload" class="primary">저장하기</button><button id="download-pending">기기에 저장</button><button id="discard-pending">이 녹화 지우기</button></div></div><div id="clips" class="clips"></div></dialog>
</main><script type="module" src="js/group-motion.js?v=studio4"></script></body></html>
