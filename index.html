<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>패션 아바타 체험</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.min.js",
    "three/addons/": "./lib/three/addons/",
    "@pixiv/three-vrm": "./lib/three-vrm.module.min.js"
  }
}
</script>
</head>
<body>

<!-- 3D 캔버스 (모든 화면 공통 배경) -->
<div id="stage"></div>

<!-- ───────── 화면 1 : 시작 ───────── -->
<section id="screen-start" class="screen active">
  <div class="start-inner">
    <div class="brand">FASHION&nbsp;AVATAR&nbsp;STUDIO</div>
    <h1>나만의 아바타와<br>런웨이에 서 보세요</h1>
    <p class="sub">카메라 앞에서 움직이면<br>아바타가 실시간으로 따라 해요</p>
    <div class="start-buttons">
      <button id="btn-mission" class="btn btn-primary btn-xl">🎯 포즈 미션 도전!</button>
      <button id="btn-done" class="btn btn-ghost btn-xl">🕺 자유 체험</button>
    </div>
    <div class="upload-row">
      <button id="btn-upload" class="btn btn-ghost">📂 내 아바타 불러오기 (.vrm)</button>
      <input type="file" id="vrm-file" accept=".vrm" hidden>
      <p class="upload-hint">VRoid Studio에서 만든 VRM 파일을 선택하면 내 아바타로 체험할 수 있어요</p>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</section>

<!-- ───────── 화면 3 : 모션 체험 ───────── -->
<section id="screen-motion" class="screen">
  <div id="guide-msg" class="guide-msg">카메라 앞에 서 주세요</div>
  <div id="cam-wrap" class="cam-preview">
    <video id="cam-bg" playsinline muted></video>
    <video id="cam" playsinline muted></video>
    <canvas id="cam-view" class="hidden"></canvas>
  </div>
  <div id="cambg-tabs" class="cambg-tabs">
    <span class="cambg-label">내 배경</span>
    <button class="chip active" data-cambg="off">그대로</button>
    <button class="chip" data-cambg="blur">흐리게</button>
    <button class="chip" data-cambg="replace">아바타 배경</button>
  </div>
  <div class="motion-bar">
    <button id="btn-photo" class="btn btn-primary btn-lg">📷 사진 찍기</button>
    <button id="btn-video" class="btn btn-ghost btn-lg">🎥 영상 찍기</button>
    <button id="btn-home-3" class="btn btn-ghost btn-lg">처음으로</button>
  </div>
  <div id="countdown" class="countdown hidden"></div>
  <div id="flash" class="flash hidden"></div>
</section>

<!-- 영상 종류 선택 -->
<div id="video-choice" class="modal hidden">
  <div class="modal-card">
    <p class="choice-title">어떤 영상으로 저장할까요?</p>
    <button id="btn-rec-avatar" class="btn btn-primary btn-lg">아바타만</button>
    <button id="btn-rec-both" class="btn btn-ghost btn-lg">아바타 + 내 모습</button>
    <button id="btn-rec-cancel" class="btn btn-text">취소</button>
  </div>
</div>

<!-- 사진 결과 -->
<div id="photo-modal" class="modal hidden">
  <div class="modal-card">
    <img id="photo-img" alt="촬영된 아바타 사진">
    <video id="video-preview" class="hidden" controls autoplay loop muted playsinline></video>
    <p id="save-note" class="save-note">사진이 저장되었어요 (다운로드 폴더)</p>
    <button id="btn-photo-close" class="btn btn-primary">확인</button>
  </div>
</div>

<!-- 로딩 -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <p id="loading-text">아바타를 불러오는 중…</p>
</div>

<!-- 샘플 아바타 안내 -->
<div id="sample-badge" class="sample-badge hidden">
  지금은 테스트용 아바타예요 — 이 폴더에 <b>character.vrm</b> 파일을 넣으면 내 아바타로 바뀝니다
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
