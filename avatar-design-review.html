<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>새 아바타 미리보기</title><link rel="stylesheet" href="./css/avatar-design-review.css"><script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script></head><body><main><header><a href="./group-motion.html">모둠 활동으로</a><h1>새 아바타 미리보기</h1><p>승인한 디자인과 실제 3D 모델을 비교해 보세요.</p></header><nav aria-label="캐릭터"><button data-kind="boy" aria-pressed="true">남학생</button><button data-kind="girl" aria-pressed="false">여학생</button></nav><div class="comparison"><section><h2>기준 디자인</h2><img id="reference" src="./assets/kids/approved/boy-front.png" alt="남학생 전신 기준 디자인"></section><section><h2>실제 3D 모델</h2><div id="stage"></div><p id="status" role="status">모델 정보를 확인하고 있어요.</p></section></div><div class="controls"><label>보는 방향<select id="view"><option value="0">정면</option><option value="0.7854">비스듬히</option><option value="1.5708">측면</option><option value="3.14159">뒷면</option></select></label><label>가까이 보기<input id="zoom" type="range" min="1" max="2.7" step=".1" value="1"></label><button id="rotate" aria-pressed="false">천천히 돌려 보기</button><a id="download" hidden download>3D 파일 받기</a></div><p id="stage-note">외형 확인 단계입니다. 관절 동작과 카메라 추적 검증은 별도로 진행합니다.</p></main><script type="module" src="./js/avatar-design-review.js"></script></body></html>
